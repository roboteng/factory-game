baseURL = "http://localhost:1313/"
languageCode = "en-us"
title = "Factory Game Docs"

contentDir = "planned-features"
publishDir = "public"

# Disable unnecessary outputs (keep section for auto-listing)
disableKinds = ["sitemap", "rss", "taxonomy", "taxonomyTerm"]

# Use Goldmark for markdown rendering (semantic HTML by default)
[markup.goldmark.renderer]
unsafe = false
hardWraps = true
