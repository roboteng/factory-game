[package]
name = "factory-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {workspace = true, features = ["bevy_log"]}
derivative = "2.2.0"
noise = "0.9.0"
rand = "0.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}

[features]
default = ["invariant-check"]
invariant-check = []
