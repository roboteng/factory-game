<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        a { color: #0066cc; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>{{ .Title }}</h1>
    <ul>
    {{ range .Pages }}
        {{ if ne .File.BaseFileName "_index" }}
        <li>
            <input type="checkbox" disabled {{ if .Params.done }}checked{{ end }}>
            <a href="{{ .RelPermalink }}">{{ if .Title }}{{ .Title }}{{ else }}{{ humanize .File.BaseFileName }}{{ end }}</a>
        </li>
        {{ end }}
    {{ end }}
    </ul>
</body>
</html>
