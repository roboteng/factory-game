[package]
name = "factory-game"
version = "0.1.0"
edition = "2024"
resolver = "2"

[features]
default = ["invariant-ckeck", "ui"]
invariant-ckeck = []
proptests = ["dep:proptest", "dep:rand"]
ui = ["bevy/2d", "bevy/bevy_sprite", "bevy/bevy_color"]

[dependencies]
bevy = { version = "0.18.0-rc.1", default-features = false, features = ["bevy_log"]}

# Optional dev-dependencies
proptest = { version = "1.5.0", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
