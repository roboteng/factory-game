[package]
name = "factory-game"
version = "0.1.0"
edition = "2024"
resolver = "2"

[features]
default = ["invariant-ckeck", "ui"]
invariant-ckeck = []
proptests = []
ui = ["bevy/2d"]

[dependencies]
bevy = { version = "0.18.0-rc.1", default-features = false}

[dev-dependencies]
pretty_assertions = "1.4.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1.5.0"
