[workspace]
members= [ "crates/*"]
resolver = "3"

[package]
name = "factory-game"
version = "0.3.0"
edition = "2024"
default-run="factory-game"

[features]
default = ["invariant-check", "ui","bevy/debug"]
ui = ["bevy/3d","bevy/bevy_color", "dep:rand", "dep:noise"]
invariant-check = []
proptests = ["dep:proptest", "dep:rand"]
dev = ["bevy/bevy_dev_tools", "bevy/trace_chrome"]

[dependencies]
factory-core={path="./crates/factory-core"}
avian3d = "0.6.1"
bevy = {version="0.18.0", default-features = false, features = ["bevy_log"]}
derivative = "2.2.0"
noise = { version = "0.9.0", optional = true }

# Optional dev-dependencies
proptest = { version = "1.5.0", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
