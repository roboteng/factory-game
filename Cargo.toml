[workspace]
resolver = "3"
members = ["common","gui"]

[package]
name = "factory-game"
version = "0.3.0"
edition = "2024"

[features]
default = ["invariant-check", "dev", "debug"]
invariant-check = []
dev = ["bevy/bevy_dev_tools"]
trace = ["bevy/trace_chrome"]
debug = ["bevy/debug"]

[workspace.dependencies]
bevy = {version = "0.18.0", default-features = false, features = ["bevy_log", "3d", "bevy_color", "debug", "dynamic_linking"]}
rand = "0.8"
avian3d = "0.6.1"
gui.path = "./gui"
common.path = "./common"

[dependencies]
gui.workspace = true
common.workspace = true
bevy.workspace = true
rand.workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
